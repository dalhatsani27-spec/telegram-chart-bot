name: Repair SMC Telegram integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair callback handler ordering
        shell: python
        run: |
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          marker = 'async def button_callback_handler(update: Update, context: ContextTypes.DEFAULT_TYPE):\n'
          start = s.find(marker)
          if start < 0:
              raise SystemExit('button_callback_handler not found')

          # The previous patch accidentally placed the SMC branches before
          # query/data/chat_id were initialized. Move that branch block below
          # initialization so every Telegram callback is valid again.
          global_marker = '    global primary_chat_id\n'
          g = s.find(global_marker, start)
          if g < 0:
              raise SystemExit('callback global initialization not found')
          init_end_marker = '    primary_chat_id = chat_id\n'
          ie = s.find(init_end_marker, g)
          if ie < 0:
              raise SystemExit('callback initialization end not found')
          ie += len(init_end_marker)

          prefix = s[g:start]  # preceding source, retained separately
          branch_block = s[start:g]
          init_block = s[g:ie]
          if 'if data == "menu_smc":' in branch_block:
              s = s[:start] + marker + init_block + branch_block + s[ie:]

          # Ensure the selected-strategy route can dispatch SMC for typed tickers.
          old_route = '''    if ts_state.get_selected_strategy() == engine.STRATEGY_OTE:\n        await send_ote_analysis(context, chat_id, symbol)\n    else:\n        await send_trendline_analysis(context, chat_id, symbol)\n'''
          new_route = '''    if ts_state.get_selected_strategy() == engine.STRATEGY_OTE:\n        await send_ote_analysis(context, chat_id, symbol)\n    elif ts_state.get_selected_strategy() == "SMC":\n        await send_smc_analysis(context, chat_id, symbol)\n    else:\n        await send_trendline_analysis(context, chat_id, symbol)\n'''
          if old_route in s:
              s = s.replace(old_route, new_route, 1)

          # The repair is valid only if initialization appears before SMC branches.
          h = s.find(marker)
          d = s.find('    data = query.data', h)
          smc = s.find('    if data == "menu_smc":', h)
          if d < 0 or smc < 0 or d > smc:
              raise SystemExit('SMC callback ordering is still invalid')

          p.write_text(s, encoding='utf-8')
          print('Repaired callback handler ordering')

      - name: Syntax check
        run: python -m py_compile bot.py smc_strategy.py market_phases.py

      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: repair Telegram callback initialization for SMC'
          git push
