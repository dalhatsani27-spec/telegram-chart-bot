name: Fix structural trendline anchors

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply structural anchor patch
        run: python patch_trendline.py

      - name: Validate
        run: python -m py_compile strategies.py chart_engine.py bot.py

      - name: Commit patch and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f patch_trendline.py .github/workflows/anchor-trendline-fix.yml
          git add strategies.py patch_trendline.py .github/workflows/anchor-trendline-fix.yml
          git diff --cached --check
          git commit -m "Anchor trendlines to structural impulse pivots"
          git push
