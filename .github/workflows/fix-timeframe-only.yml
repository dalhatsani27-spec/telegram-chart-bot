name: Fix trendline timeframe only

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Change only hard-coded M30 title
        shell: python
        run: |
          from pathlib import Path
          p = Path("chart_engine.py")
          s = p.read_text(encoding="utf-8")
          old = '    title = f"{symbol}  |  M30  |  {direction} BIAS  |  {status.replace(\'_\', \' \')}"'
          new = '    tf_label = str(family.get("timeframe_label") or family.get("timeframe") or "").strip().upper() or "TF"\n    title = f"{symbol}  |  {tf_label}  |  {direction} BIAS  |  {status.replace(\'_\', \' \')}"'
          if old not in s:
              raise SystemExit("Expected M30 title line not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
      - name: Commit only timeframe change and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chart_engine.py
          git commit -m "Make Trendline chart timeframe dynamic"
          git rm .github/workflows/fix-timeframe-only.yml
          git commit -m "Remove temporary timeframe patch workflow"
          git push
