name: One-time analysis maintenance patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Add one-time trendline and confirmation maintenance patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply analysis fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('strategies.py')
          s = p.read_text()

          if 'STATEFUL_CONFIRMATION_V2' not in s:
              start = s.index('def _entry_confirmation(')
              end = s.index('\ndef _trendline_retest_state(', start)
              new = r'''def _entry_confirmation(df: pd.DataFrame, direction: str, trigger_index: Optional[int] = None) -> Dict[str, Any]:
    """Stateful confirmation engine.

    A confirmation is an event, not a property of the newest candle. Search
    candles after the structural trigger (or the recent confirmation window
    when there is no explicit trigger), retain the latest valid 3/4 event, and
    keep it valid for a short execution window while the setup remains intact.
    This prevents a quiet candle after a real confirmation from resetting the
    signal to WAIT.
    """
    checks = {
        'candle': (False, 'no candle data'),
        'structure': (False, 'no structure data'),
        'momentum': (False, 'no momentum data'),
        'rsi': (False, 'no RSI data'),
    }
    result = {
        'checks': checks, 'passed': 0, 'required': 3, 'confirmed': False,
        'event_index': None, 'age_bars': None,
        'note': 'No valid confirmation event in the execution window.',
    }
    if df is None or len(df) < 25 or direction not in ('BUY', 'SELL'):
        return result

    # With a known trigger, only confirmations at/after that trigger count.
    # Without one, use a short recent window so an unrelated old candle cannot
    # resurrect a stale setup.
    if trigger_index is None:
        start = max(20, len(df) - 10)
    else:
        start = max(20, int(trigger_index))
    end = len(df) - 1

    best = None
    for i in range(start, end + 1):
        sub = df.iloc[:i + 1].copy()
        local = {k: (False, v[1]) for k, v in checks.items()}
        try:
            found, name = detect_confirmation_candle(sub, direction)
            local['candle'] = (bool(found), name or 'no matching confirmation candle')
        except Exception:
            pass
        try:
            minor = analyse_structure(sub, left=2, right=2, lookback=min(30, len(sub) - 1))
            want_bias = 'BULLISH' if direction == 'BUY' else 'BEARISH'
            ok = minor.get('last_event') in ('BOS', 'MSS') and minor.get('event_bias') == want_bias
            local['structure'] = (bool(ok), minor.get('note') or 'no confirming minor BOS/MSS')
        except Exception:
            pass
        try:
            if 'Volume' in sub.columns and sub['Volume'].tail(20).sum() > 0:
                rv = float(sub['Volume'].iloc[-1])
                av = float(sub['Volume'].iloc[-11:-1].mean()) if len(sub) > 11 else rv
                local['momentum'] = (rv > av * 1.05, f'vol {rv:.0f} vs 10-bar avg {av:.0f}')
            elif len(sub) > 6:
                roc = float((sub['Close'].iloc[-1] - sub['Close'].iloc[-6]) / sub['Close'].iloc[-6] * 100)
                local['momentum'] = (roc > 0.05 if direction == 'BUY' else roc < -0.05,
                                     f'5-bar RoC {roc:+.2f}% (no volume feed)')
        except Exception:
            pass
        try:
            if 'RSI' in sub.columns:
                rsi = float(sub['RSI'].iloc[-1])
                local['rsi'] = (rsi > 50 if direction == 'BUY' else rsi < 50, f'RSI {rsi:.1f}')
        except Exception:
            pass

        passed = sum(1 for ok, _ in local.values() if ok)
        if passed >= 3:
            best = (i, local, passed)

    if best is None:
        return result

    event_i, local, passed = best
    age = (len(df) - 1) - event_i
    # A confirmation remains actionable for 18 bars unless the setup is
    # invalidated elsewhere. This is long enough for a retest but short enough
    # not to carry yesterday's signal into a new market structure.
    if age > 18:
        return result

    result.update({
        'checks': local,
        'passed': passed,
        'confirmed': True,
        'event_index': int(event_i),
        'age_bars': int(age),
        'note': f'Confirmation retained from bar {event_i} ({age} bars ago).',
    })
    return result


# STATEFUL_CONFIRMATION_V2
'''
              s = s[:start] + new + s[end:]

          # Pass the structural/retest trigger into the stateful confirmation engine.
          old = 'entry_rules = _entry_confirmation(df, direction) if direction in ("BUY", "SELL") else None'
          new = '''trigger_index = None\n    if direction in ("BUY", "SELL"):\n        trigger_index = (trendline_retest.get("retest_index") or trendline_retest.get("break_index"))\n    entry_rules = _entry_confirmation(df, direction, trigger_index=trigger_index) if direction in ("BUY", "SELL") else None'''
          s = s.replace(old, new, 1)

          # Make the primary line more forgiving: if the strict HH/HL/LH/LL
          # chain cannot form a line, use the best two-point structural rail.
          needle = '    resistance = _fit_primary(recent_pivots, "resistance", n, df)\n'
          insert = needle + '''\n    # Fallback rails: real markets often have a clean two-touch trendline\n    # even when the strict alternating structural chain is interrupted by a\n    # deep wick. Do not leave the chart blank in that case.\n    if support is None:\n        cand = _fit_line_any_slope(recent_pivots, "support", n, df)\n        if cand and cand.get("slope", 0) > 0 and cand.get("touches", 0) >= 2:\n            cand["kind"] = "support"\n            cand["method"] = "two_point_fallback"\n            support = cand\n    if resistance is None:\n        cand = _fit_line_any_slope(recent_pivots, "resistance", n, df)\n        if cand and cand.get("slope", 0) < 0 and cand.get("touches", 0) >= 2:\n            cand["kind"] = "resistance"\n            cand["method"] = "two_point_fallback"\n            resistance = cand\n'''
          s = s.replace(needle, insert, 1)

          # Replace trendline lifecycle detector with break/retest + ordinary
          # support/resistance bounce detection.
          start = s.index('def _trendline_retest_state(')
          end = s.index('\ndef _trendline_swing_annotations(', start)
          retest = r'''def _trendline_retest_state(df: pd.DataFrame, line: Optional[Dict[str, Any]],
                            breakout: Optional[Dict[str, Any]],
                            break_kind: Optional[str]) -> Dict[str, Any]:
    """Identify both break/retest and normal trendline retests.

    A trendline retest is not only a post-break event. In a live trend, a
    valid retest is a touch of the rail followed by rejection in the rail's
    direction. After a break, the same rail is treated as resistance/support
    and the reclaim/hold sequence is evaluated separately.
    """
    out = {
        'status': 'INTACT', 'break_index': None, 'retest_index': None,
        'retest_level': None, 'fakeout': False,
        'note': 'No confirmed trendline retest.'
    }
    if df is None or df.empty or not line:
        return out

    n = len(df)
    def lv(i):
        return _line_value(line['x0'], line['y0'], line['x1'], line['y1'], i)

    closes = df['Close'].to_numpy(float)
    highs = df['High'].to_numpy(float)
    lows = df['Low'].to_numpy(float)
    opens = df['Open'].to_numpy(float)
    atrs = df['ATR'].to_numpy(float) if 'ATR' in df.columns else (df['High'] - df['Low']).to_numpy(float)
    role = str(line.get('kind') or 'support')

    kind = break_kind
    if kind is None:
        kind = 'support_break_down' if role == 'support' else 'resistance_break_up'
    is_down = kind == 'support_break_down'

    # 1) Find a genuine close-through break.
    start = max(int(line.get('x1', 0)) + 1, n - 35)
    break_i = None
    for i in range(start, n):
        line_i = lv(i)
        atr = max(float(atrs[i]), 1e-9)
        body = abs(closes[i] - opens[i]); rng = max(highs[i] - lows[i], 1e-9)
        beyond = closes[i] < line_i if is_down else closes[i] > line_i
        if beyond and abs(closes[i] - line_i) / atr >= 0.10 and body / rng >= 0.35:
            break_i = i
            break

    if break_i is not None:
        out['break_index'] = break_i
        for i in range(break_i + 1, n):
            line_i = lv(i); atr = max(float(atrs[i]), 1e-9)
            touched = (highs[i] >= line_i - atr * 0.35) if is_down else (lows[i] <= line_i + atr * 0.35)
            held = closes[i] < line_i if is_down else closes[i] > line_i
            if touched and held:
                out.update(status='BREAK_RETEST_CONFIRMED', retest_index=i,
                           retest_level=float(line_i),
                           note='Break confirmed, then broken rail was retested and held.')
                return out
            reclaimed = closes[i] > line_i if is_down else closes[i] < line_i
            if reclaimed:
                out.update(status='FAKEOUT', retest_index=i,
                           retest_level=float(line_i), fakeout=True,
                           note='Break was reclaimed before a valid retest held.')
                return out
        out.update(status='BREAK_CONFIRMED', retest_level=float(lv(n - 1)),
                   note='Trendline break detected; waiting for a clean retest.')
        return out

    # 2) No break: detect an ordinary trendline retest/rejection.
    scan_start = max(int(line.get('x1', 0)) + 1, n - 18)
    for i in range(scan_start, n):
        line_i = lv(i); atr = max(float(atrs[i]), 1e-9)
        body = abs(closes[i] - opens[i]); rng = max(highs[i] - lows[i], 1e-9)
        body_ratio = body / rng
        if role == 'support':
            touched = lows[i] <= line_i + atr * 0.35
            rejected = closes[i] > line_i + atr * 0.10 and closes[i] > opens[i]
            direction = 'BUY'
        else:
            touched = highs[i] >= line_i - atr * 0.35
            rejected = closes[i] < line_i - atr * 0.10 and closes[i] < opens[i]
            direction = 'SELL'
        if touched and rejected and body_ratio >= 0.35:
            out.update(status='RETEST_CONFIRMED', retest_index=i,
                       retest_level=float(line_i), direction=direction,
                       note=f'{role.capitalize()} trendline retest rejected with a directional candle.')
            return out

    return out

'''
          s = s[:start] + retest + s[end:]

          # Report lifecycle text for ordinary retests.
          old = '''    if status == "BREAK_RETEST_CONFIRMED":\n'''
          new = '''    if status == "RETEST_CONFIRMED":\n        return {\n            "breakout": "NOT BROKEN",\n            "close": "—",\n            "retest": "CONFIRMED",\n            "displacement": "CONFIRMED" if brk.get("strength") == "confirmed" else "DEVELOPING",\n            "status": status,\n        }\n    if status == "BREAK_RETEST_CONFIRMED":\n'''
          s = s.replace(old, new, 1)

          # Do not ask for a trendline confirmation when the retest itself is confirmed.
          s = s.replace('if lifecycle["status"] == "INTACT":\n            waits.append("trendline confirmation")',
                        'if lifecycle["status"] == "INTACT" and lifecycle["retest"] != "CONFIRMED":\n            waits.append("trendline confirmation")', 1)

          p.write_text(s)

          # Add OB rectangles/labels to the Trendline renderer.
          cp = Path('chart_engine.py')
          c = cp.read_text()
          if 'TRENDLINE_OB_ZONES_V2' not in c:
              marker = '    # Trendline lifecycle markers: BREAK / RETEST are derived from candle\n'
              block = r'''    # TRENDLINE_OB_ZONES_V2: draw the same real OB rectangles used by SMC.\n    # The strategy indices are from the full dataframe; translate them to the\n    # visible tail so zones line up with the candles instead of floating.\n    full_df = family.get("df")\n    chart_offset = max(0, len(full_df) - chart_len) if full_df is not None else 0\n    for z in (family.get("order_blocks") or []):\n        try:\n            left_full = int(z.get("formed_index", 0))\n            left = left_full - chart_offset\n            right = chart_len - 1\n            if right < 0 or left > right or right < 0:\n                continue\n            bottom = float(z.get("bottom"))\n            top = float(z.get("top"))\n            if top <= bottom:\n                continue\n            ob_type = str(z.get("type", "")).lower()\n            edge = "#00e676" if ob_type == "bullish" else "#ff1744"\n            alpha = 0.14 if z.get("freshness") == "untested" else 0.07\n            if z.get("is_inducement"):\n                edge = "#ffab00"; alpha = 0.10\n            ax.add_patch(mpatches.Rectangle((max(0, left), bottom),\n                                             max(1, right - max(0, left)), top - bottom,\n                                             facecolor=edge, edgecolor=edge,\n                                             linewidth=1.2, alpha=alpha, zorder=2.5))\n            role = "INDUCEMENT OB" if z.get("is_inducement") else ("BULLISH OB" if ob_type == "bullish" else "BEARISH OB")\n            fresh = str(z.get("freshness") or "")\n            label = f"{role} · {fresh}" if fresh else role\n            lx = max(0, min(right - 2, max(0, left) + 1))\n            ax.text(lx, top, label, fontsize=6.8, fontweight="bold",\n                    color=edge, va="bottom", zorder=12,\n                    bbox=dict(boxstyle="round,pad=.15", facecolor="#0d1117", alpha=.72, edgecolor="none"))\n        except Exception:\n            continue\n\n'''
              block = block.replace('\\n', '\n')
              if marker not in c:
                  raise SystemExit('Trendline renderer marker not found')
              c = c.replace(marker, block + marker, 1)
              cp.write_text(c)

          # Add a visible lifecycle/retest line to the Trendline chart title/report data.
          print('analysis maintenance patch applied')

      - name: Validate
        run: |
          python -m py_compile strategies.py chart_engine.py smc_engine.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add strategies.py chart_engine.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix stateful confirmation, trendline retests, and OB mapping"
          git push origin HEAD:main

      - name: Remove one-time workflow
        if: success()
        run: |
          git rm .github/workflows/maintenance_fix_analysis.yml
          git commit -m "Remove one-time maintenance workflow"
          git push origin HEAD:main
