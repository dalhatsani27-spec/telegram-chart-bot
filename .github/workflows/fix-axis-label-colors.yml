name: Fix chart axis label colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch only axis tick colors
        shell: python
        run: |
          from pathlib import Path
          p = Path("chart_engine.py")
          s = p.read_text(encoding="utf-8")

          anchor = '''    mpf.plot(chart_df, **mpf_kwargs)\n    ax.set_ylim(price_min - padding, price_max + padding)\n'''
          replacement = '''    mpf.plot(chart_df, **mpf_kwargs)\n\n    # Keep the chart axes readable on the dark background.  Do not add or\n    # change any price/date data; this only changes the tick label appearance.\n    ax.tick_params(axis="x", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.tick_params(axis="y", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.set_ylim(price_min - padding, price_max + padding)\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f"Expected chart anchor exactly once, found {s.count(anchor)}")
          s = s.replace(anchor, replacement, 1)
          p.write_text(s, encoding="utf-8")

      - name: Validate and commit
        shell: bash
        run: |
          python -m py_compile chart_engine.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-axis-label-colors.yml
          git add chart_engine.py .github/workflows/fix-axis-label-colors.yml
          git diff --cached --check
          git commit -m "Fix trendline chart axis label colors"
          git push
