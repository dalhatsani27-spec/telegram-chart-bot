name: Direct Visual Trendline Integration

on:
  push:
    paths:
      - visual_integration_trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire visual renderer into real Telegram path
        shell: python
        run: |
          from pathlib import Path
          p = Path("bot.py")
          s = p.read_text(encoding="utf-8")
          if "from visual_pattern_engine import render_trendline_map as render_visual_trendline_map" not in s:
              marker = "import strategies"
              if marker not in s:
                  raise SystemExit("Cannot locate strategies import in bot.py")
              s = s.replace(marker, "from visual_pattern_engine import render_trendline_map as render_visual_trendline_map\n" + marker, 1)
          replacements = [
              "chart_img = generate_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)",
              "chart_img = generate_trendline_educational_map(df_tl, symbol, chart_payload, title_suffix=ts_str)",
          ]
          visual_call = "chart_img = render_visual_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)"
          if visual_call not in s:
              for old in replacements:
                  if old in s:
                      s = s.replace(old, visual_call, 1)
                      break
              else:
                  raise SystemExit("Cannot locate actual Trendline chart call in bot.py")
          p.write_text(s, encoding="utf-8")

      - name: Verify direct integration
        run: |
          grep -n "render_visual_trendline_map" bot.py
          python -m py_compile bot.py visual_pattern_engine.py

      - name: Commit direct integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire visual pattern renderer into actual Trendline path"
          git push origin HEAD:main
