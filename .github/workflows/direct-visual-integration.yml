name: Direct Visual Trendline Integration

on:
  push:
    paths:
      - visual_integration_trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire visual renderer into real Telegram path
        shell: python
        run: |
          from pathlib import Path
          p = Path("bot.py")
          s = p.read_text(encoding="utf-8")
          old_import = "from chart_engine import generate_trendline_map, generate_ote_map"
          new_import = "from chart_engine import generate_trendline_map, generate_ote_map\nfrom visual_pattern_engine import render_trendline_map as render_visual_trendline_map"
          if "render_visual_trendline_map" not in s:
              if old_import not in s:
                  raise SystemExit("Expected chart_engine import not found")
              s = s.replace(old_import, new_import, 1)
          old_call = "chart_img = generate_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)"
          new_call = "chart_img = render_visual_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)"
          if old_call in s:
              s = s.replace(old_call, new_call, 1)
          elif "chart_img = render_visual_trendline_map(df_tl, symbol, chart_payload" not in s:
              raise SystemExit("Expected Trendline chart call not found")
          p.write_text(s, encoding="utf-8")

      - name: Commit direct integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bot.py
          git diff --cached --quiet && exit 0
          git commit -m "Wire visual pattern renderer into Trendline Telegram path"
          git push origin HEAD:main
