name: Direct Visual Trendline Integration

on:
  push:
    paths:
      - visual_integration_trigger.txt

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Wire visual renderer into bot.py
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bot.py')
          s = p.read_text(encoding='utf-8')
          imp = 'from visual_pattern_engine import render_trendline_map as render_visual_trendline_map'
          if imp not in s:
              s = s.replace('import strategies', imp + '\nimport strategies', 1)
          old = 'chart_img = generate_trendline_educational_map(df_tl, symbol, chart_payload, title_suffix=ts_str)'
          old2 = 'chart_img = generate_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)'
          new = 'chart_img = render_visual_trendline_map(df_tl, symbol, chart_payload, title_suffix=ts_str)'
          if new not in s:
              if old in s:
                  s = s.replace(old, new, 1)
              elif old2 in s:
                  s = s.replace(old2, new, 1)
              else:
                  raise SystemExit('Actual Trendline chart call not found')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify
        run: |
          grep -n "render_visual_trendline_map" bot.py
          python -m py_compile bot.py visual_pattern_engine.py

      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bot.py
          git diff --cached --quiet || git commit -m 'Wire visual pattern renderer into Trendline path'
          git push origin HEAD:main
