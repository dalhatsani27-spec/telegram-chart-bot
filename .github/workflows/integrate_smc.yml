name: Validate SMC Hybrid Dashboard

on:
  push:
    branches:
      - integrate-smc-hybrid-main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: |
          python -m py_compile bot.py smc_engine.py strategies.py chart_engine.py market_data.py execution_engine.py

      - name: Run tests if present
        run: |
          if [ -d tests ] || [ -f pytest.ini ] || [ -f pyproject.toml ] || [ -f setup.cfg ]; then
            python -m pytest -q
          else
            echo "No pytest suite found; compile validation passed."
          fi
