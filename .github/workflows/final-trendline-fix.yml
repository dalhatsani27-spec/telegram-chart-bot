name: Final Trendline breakout and axis fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply exact fixes
        shell: python
        run: |
          from pathlib import Path

          # ---- strategies.py: detect a break of either rail in a dual-rail map ----
          p = Path("strategies.py")
          s = p.read_text(encoding="utf-8")
          anchor = '    # Trendline lifecycle: intact -> break -> retest (or fakeout).\n'
          if anchor not in s:
              raise SystemExit("Could not find the current trendline lifecycle block")
          insert = '''    # Dual-rail breakout detection: when both rising support and falling\n    # resistance exist, inspect BOTH rails before the lifecycle/report block.\n    # The previous logic only graded a breakout inside the single-rail branch,\n    # so a visible close below rising support could still be reported as\n    # NOT BROKEN when the two rails were both present.\n    if support and resistance:\n        close_now = float(df["Close"].iloc[-1])\n        support_now = float(support["y_end"])\n        resistance_now = float(resistance["y_end"])\n\n        if close_now < support_now:\n            primary = support\n            family_kind = "ascending"\n            breakout_grade = _grade_breakout(df, support, "support_break_down", n)\n            direction = "SELL"\n            reasons.append(\n                f"BREAK below rising support — {breakout_grade['penetration_atr']} ATR, "\n                f"{breakout_grade['consecutive_closes']} close(s), body {breakout_grade['body_ratio']}"\n            )\n        elif close_now > resistance_now:\n            primary = resistance\n            family_kind = "descending"\n            breakout_grade = _grade_breakout(df, resistance, "resistance_break_up", n)\n            direction = "BUY"\n            reasons.append(\n                f"BREAK above falling resistance — {breakout_grade['penetration_atr']} ATR, "\n                f"{breakout_grade['consecutive_closes']} close(s), body {breakout_grade['body_ratio']}"\n            )\n\n'''
          s = s.replace(anchor, insert + anchor, 1)
          p.write_text(s, encoding="utf-8")

          # ---- chart_engine.py: force actual rendered axis text to white ----
          p = Path("chart_engine.py")
          s = p.read_text(encoding="utf-8")
          axis_anchor = '    ax = axes[0]\n'
          if axis_anchor not in s:
              raise SystemExit("Could not find mplfinance returned axis")
          axis_fix = '''    ax = axes[0]\n\n    # Final dark-theme axis contrast: explicitly set the rendered tick and\n    # axis-label artists. This is visual-only; price/date values are untouched.\n    ax.tick_params(axis="x", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.tick_params(axis="y", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.xaxis.label.set_color(COLORS["text"])\n    ax.yaxis.label.set_color(COLORS["text"])\n    for _lbl in ax.get_xticklabels():\n        _lbl.set_color(COLORS["text"])\n    for _lbl in ax.get_yticklabels():\n        _lbl.set_color(COLORS["text"])\n'''
          s = s.replace(axis_anchor, axis_fix, 1)

          save_anchor = '    img_buf = io.BytesIO()\n    fig.savefig(img_buf, dpi=190, bbox_inches="tight", facecolor=fig.get_facecolor())\n'
          if save_anchor not in s:
              raise SystemExit("Could not find educational Trendline save block")
          save_fix = '''    # Repeat the axis contrast pass immediately before rendering so no later\n    # Matplotlib/mplfinance operation can revert the labels to black.\n    ax.tick_params(axis="x", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.tick_params(axis="y", colors=COLORS["text"], labelcolor=COLORS["text"])\n    ax.xaxis.label.set_color(COLORS["text"])\n    ax.yaxis.label.set_color(COLORS["text"])\n    for _lbl in ax.get_xticklabels():\n        _lbl.set_color(COLORS["text"])\n    for _lbl in ax.get_yticklabels():\n        _lbl.set_color(COLORS["text"])\n\n    img_buf = io.BytesIO()\n    fig.savefig(img_buf, dpi=190, bbox_inches="tight", facecolor=fig.get_facecolor())\n'''
          s = s.replace(save_anchor, save_fix, 1)
          p.write_text(s, encoding="utf-8")

      - name: Validate
        run: python -m py_compile strategies.py chart_engine.py bot.py

      - name: Commit fixes and remove temporary workflows
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/final-trendline-fix.yml
          rm -f .github/workflows/fix-breakout-axis.yml
          rm -f .github/workflows/educational-trendline-map.yml
          git add strategies.py chart_engine.py .github/workflows/final-trendline-fix.yml .github/workflows/fix-breakout-axis.yml .github/workflows/educational-trendline-map.yml
          git commit -m "Fix Trendline breakout detection and axis labels"
          git push
