name: Install 20-SMA trendline mapper

on:
  push:
    branches:
      - trendline-20sma-map-v2

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final trendline-v2 hook
        shell: python
        run: |
          from pathlib import Path

          p = Path("sitecustomize.py")
          text = p.read_text(encoding="utf-8")
          marker = "# TRENDLINE_V2_FINAL_HOOK"
          if marker not in text:
              text += '''\n\n# TRENDLINE_V2_FINAL_HOOK\ntry:\n    import trendline_mapper_v2\n    trendline_mapper_v2.install()\nexcept Exception as _trendline_v2_exc:\n    print(f"[trendline_v2] final hook failed: {_trendline_v2_exc!r}")\n'''
              p.write_text(text, encoding="utf-8")

      - name: Commit hook
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitecustomize.py
          if git diff --cached --quiet; then
            echo "No hook change needed."
          else
            git commit -m "Activate 20-SMA trendline mapper"
            git push
          fi
