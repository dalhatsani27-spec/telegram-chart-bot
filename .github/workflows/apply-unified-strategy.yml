name: Apply unified strategy architecture
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[unified-migration]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migrate UI and execution state to one strategy
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('bot.py'); s=p.read_text()
          if 'import unified_strategy' not in s:
              s=s.replace('import smc_strategy\n','import smc_strategy\nimport unified_strategy\n')
          home='''def get_home_menu():\n    """Home interface -- one unified strategy."""\n    keyboard = [\n        [InlineKeyboardButton("🧠 UNIFIED MARKET INTELLIGENCE", callback_data="menu_unified")],\n        [InlineKeyboardButton("📍  HTF Context", callback_data="prompt_htf_context")],\n        [InlineKeyboardButton("👁  Watch Price Level", callback_data="menu_price_watch"),\n         InlineKeyboardButton("📋  My Watch Levels", callback_data="show_price_watches")],\n        [InlineKeyboardButton("🔎  Custom Ticker", callback_data="prompt_custom_ticker")],\n        [InlineKeyboardButton("📱  CONTROL PANEL", callback_data="menu_mobile_panel")],\n        [InlineKeyboardButton("ℹ️  HELP & GUIDE", callback_data="menu_help")],\n    ]\n    return InlineKeyboardMarkup(keyboard)\n\n\ndef get_strategy_menu():\n    return InlineKeyboardMarkup([[InlineKeyboardButton("🧠 Unified Market Intelligence", callback_data="menu_unified")], [InlineKeyboardButton("« Back", callback_data="menu_home")]])\n\n\n'''
          s=re.sub(r'def get_home_menu\(\):.*?(?=def get_mobile_panel_menu\(\):)',home,s,flags=re.S)
          route='''    await send_unified_analysis(context, chat_id, symbol)'''
          s=re.sub(r'    strat = ts_state\.get_selected_strategy\(\)\n    if strat == engine\.STRATEGY_OTE:.*?        await send_trendline_analysis\(context, chat_id, symbol\)',route,s,flags=re.S)
          if 'async def send_unified_analysis' not in s:
              marker='async def send_ote_analysis(context, chat_id, symbol):'
              fn='''async def send_unified_analysis(context, chat_id, symbol):\n    try:\n        analysis = unified_strategy.analyze(symbol, timeframe=ts_state.get_watch_timeframe())\n        await context.bot.send_message(chat_id=chat_id, text=unified_strategy.format_report(analysis))\n        if ts_state.get_mode() == engine.MODE_COPY_TRADE and analysis.get("ready"):\n            await context.bot.send_message(chat_id=chat_id, text=format_trade_ticket(symbol, unified_strategy.STRATEGY_NAME, analysis.get("direction"), analysis.get("score",0), None, analysis.get("evidence")))\n        await context.bot.send_message(chat_id=chat_id, text="Choose next action:", reply_markup=get_home_menu())\n    except Exception as e:\n        await context.bot.send_message(chat_id=chat_id, text=f"Unified analysis failed for '{symbol}': {e}", reply_markup=get_home_menu())\n\n\n'''
              s=s.replace(marker,fn+marker)
          if 'data == "menu_unified"' not in s:
              marker='    # ---------------- Trendline ----------------'
              cb='''    # ---------------- Unified strategy ----------------\n    elif data == "menu_unified":\n        await query.edit_message_text("🧠 UNIFIED MARKET INTELLIGENCE\\n\\nTrendline, SMC and OTE are internal intelligence modules.\\nThe bot makes one final market-state decision.", reply_markup=get_home_menu())\n\n'''
              s=s.replace(marker,cb+marker)
          s=s.replace('strat_label = ts_state.strategy_label()','strat_label = unified_strategy.STRATEGY_NAME')
          s=s.replace('Trendline Structure  •  OTE 62–79% Retracement','Unified Market Intelligence')
          s=s.replace('This is an analysis alert — confirm structure/trendline/pattern/OTE before trading.','This is an analysis alert — confirm the unified market-state decision before trading.')
          p.write_text(s)

          p=Path('execution_engine.py'); s=p.read_text()
          if 'import unified_strategy' not in s:
              s=s.replace('from strategies import build_trendline_family, build_position_container','from strategies import build_trendline_family, build_position_container\nimport unified_strategy')
          s=s.replace('STRATEGY_TRENDLINE = "TRENDLINE"\nSTRATEGY_OTE = "OTE"\nSTRATEGY_SMC = "SMC"\nVALID_STRATEGIES = {STRATEGY_TRENDLINE, STRATEGY_OTE, STRATEGY_SMC}','STRATEGY_UNIFIED = "UNIFIED"\n# Legacy constants retained only so stale callbacks do not crash; they are not selectable.\nSTRATEGY_TRENDLINE = "TRENDLINE"\nSTRATEGY_OTE = "OTE"\nSTRATEGY_SMC = "SMC"\nVALID_STRATEGIES = {STRATEGY_UNIFIED}')
          s=s.replace('self.selected_strategy = STRATEGY_TRENDLINE','self.selected_strategy = STRATEGY_UNIFIED')
          s=s.replace('return self.selected_strategy.title().replace("_", " ")','return "Unified Market Intelligence" if self.selected_strategy == STRATEGY_UNIFIED else self.selected_strategy.title().replace("_", " ")')
          p.write_text(s)
      - name: Validate
        run: python -m py_compile bot.py execution_engine.py unified_strategy.py
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bot.py execution_engine.py .github/workflows/apply-unified-strategy.yml
          git commit -m "refactor: one unified market intelligence strategy [unified-migration]" || exit 0
          git push
